name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      # Check before building: a build must not hide a stale checked-in artifact.
      - run: npm run check:bundle
      - run: npm run check
      - run: node scripts/licenses.mjs && git diff --exit-code -- THIRD_PARTY_NOTICES.txt
      - run: npm audit --include=dev
